<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Калькулятор суточных калорий: расчёт нормы по формуле Миффлина — Сан Жеора с учётом пола, возраста, роста, веса и уровня активности.">
  <title>Калькулятор суточных калорий</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">Калькулятор суточных калорий</h1>
      <p class="site-subtitle">Формула Миффлина — Сан Жеора с учётом уровня активности</p>
    </div>
  </header>

  <main class="container main">
    <section class="card" aria-labelledby="form-title">
      <h2 class="card-title" id="form-title">Расчёт нормы</h2>

      <form id="calc-form" novalidate>
        <fieldset class="fieldset-reset">
          <legend>Пол</legend>
          <label class="radio">
            <input type="radio" name="gender" value="male" checked>
            <span>Мужской</span>
          </label>
          <label class="radio">
            <input type="radio" name="gender" value="female">
            <span>Женский</span>
          </label>
        </fieldset>

        <div class="field">
          <label for="age">Возраст, полных лет</label>
          <input type="text" id="age" name="age" inputmode="numeric" placeholder="Например: 25" autocomplete="off">
          <p class="error" id="error-age"></p>
        </div>

        <div class="field">
          <label for="height">Рост, см</label>
          <input type="text" id="height" name="height" inputmode="numeric" placeholder="Например: 178" autocomplete="off">
          <p class="error" id="error-height"></p>
        </div>

        <div class="field">
          <label for="weight">Вес, кг</label>
          <input type="text" id="weight" name="weight" inputmode="decimal" placeholder="Например: 72.5" autocomplete="off">
          <p class="error" id="error-weight"></p>
        </div>

        <div class="field">
          <label for="activity">Уровень активности</label>
          <select id="activity" name="activity">
            <option value="1.2">Минимальная — сидячая работа, без тренировок</option>
            <option value="1.375">Небольшая — 1–3 тренировки в неделю</option>
            <option value="1.55" selected>Средняя — 3–5 тренировок в неделю</option>
            <option value="1.725">Высокая — 6–7 тренировок в неделю</option>
            <option value="1.9">Очень высокая — физическая работа и тренировки</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Рассчитать</button>
        <p class="error form-error" id="form-error" role="alert"></p>

        <div class="result" id="result" hidden aria-live="polite">
          <p class="result-label">Ваша суточная норма:</p>
          <p class="result-value" id="result-value"></p>
          <p class="result-note" id="result-note"></p>
        </div>
      </form>
    </section>

    <section class="card" aria-labelledby="journal-title">
      <div class="journal-head">
        <h2 class="card-title" id="journal-title">Журнал запросов</h2>
        <button type="button" class="btn btn-ghost" id="clear-journal">Очистить журнал</button>
      </div>
      <p class="empty-note" id="empty-journal">Пока запросов нет — сделайте первый расчёт.</p>
      <ul class="journal" id="journal"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">Калькулятор суточных калорий · учебный проект · v1.0.0</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
